[project]
name = "line-personal-ai"
version = "0.1.0"
description = "LINE personal AI assistant - Phase 1: webhook -> Claude -> reply"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "line-bot-sdk>=3.14",
    "anthropic>=0.40",
    "cryptography>=50.0.0",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
