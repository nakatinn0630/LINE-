[project]
name = "line-personal-ai"
version = "0.1.0"
description = "LINE personal AI assistant - Phase 1: webhook -> Claude -> reply"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "line-bot-sdk>=3.14",
    "anthropic>=0.40",
    "cryptography>=50.0.0",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# This project is bilingual; Japanese text legitimately uses full-width
# punctuation, so the ambiguous-character rules are pure noise here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests drive external processes and assert on the result themselves; an
# implicit check=True would turn an expected failure into an error.
"tests/*" = ["S603"]
